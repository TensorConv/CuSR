[project]
name = "cusr"
version = "0.1.0"
description = "Batched, heterogeneous-K Levenberg-Marquardt constant optimization on the GPU for symbolic regression."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "matplotlib>=3.10.8",
    # torch 2.7+ ships CUDA 12.8 runtime → matches cuda-toolkit-128 env →
    # required for sm_120 (Blackwell, RTX 5070 Ti). 2.5–2.6 only support
    # sm_50..sm_90 and error with "no kernel image" on Blackwell.
    "torch>=2.7",
    # bench/ platform core (see bench/, tests/, experiments/003_nls_bench/)
    "sympy>=1.12",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "pytest>=8.0",
    # EvoGP transitive deps (problem/classification.py imports sklearn at
    # package import time; tree.to_png uses networkx). Needed for T-02.
    "scikit-learn>=1.8.0",
    "networkx>=3.6.1",
    "pysr>=1.5.10",
    "pypdf>=6.10.2",
    "pyoperon>=0.6.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cusr*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.optional-dependencies]
# PSE / PSRN deps — original requirements.txt pinned to py3.9 era; we relax
# to >= so they resolve on py3.12. numba and numpy *must* be >=0.59 / >=1.26
# for py3.12 support; the rest just work with looser bounds.
# Install with: uv sync --extra pse
pse = [
    "click>=8.0",
    "deap>=1.3",
    "dysts>=0.1",
    "matplotlib>=3.7",
    "numba>=0.59",
    "numpy>=1.26",
    "pandas>=1.5",
    "pysindy>=1.7",
    "derivative>=0.6",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "seaborn>=0.13",
    "symengine>=0.11",
    "sympy>=1.10",
    "tqdm>=4.65",
]

[tool.uv]
# Dependencies are added ad-hoc via `uv add` as experiments demand them.
# Do NOT pre-commit to a framework here — scope is still unfolding.

# Default to TUNA PyPI mirror — fast domestic + bypasses local proxy
# (see scripts/env.sh no_proxy). Override with UV_INDEX_URL elsewhere.
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# torch+cu128 wheels live on PyTorch's own index, not PyPI / TUNA.
# Required for sm_120 (Blackwell). Pin torch to this index explicitly.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "jupytext>=1.19.1",
    "nbconvert>=7.17.1",
    "pypdf>=6.10.2",
]
